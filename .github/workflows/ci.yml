name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every reference solution must build and pass on the toolchain the course
  # is written against: Apple clang on macOS. The full matrix (Linux clang and
  # GCC, sanitizers, formatting, and the starter-must-fail check) can still be
  # run locally with ./scripts/check-course.sh and ./mcpp.
  solutions:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            compiler: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja
             -DCMAKE_BUILD_TYPE=Debug
             -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
             -DMCPP_BUILD_SOLUTIONS=ON
             -DMCPP_BUILD_EXERCISES=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The CUDA chapters cannot be RUN here (GitHub's hosted runners have no GPU),
  # but they can be COMPILED: nvcc needs no device. That catches the large
  # majority of mistakes -- a misspelt API, a host function called from device
  # code, a missing header -- on every push. Running them is what
  # ./scripts/check-course.sh on the GPU machine is for.
  cuda-compile-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit (compiler and headers only)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            cuda-nvcc-13-0 cuda-cudart-dev-13-0 cuda-cccl-13-0 cuda-nvtx-13-0 \
            cuda-profiler-api-13-0 ninja-build
          echo "/usr/local/cuda-13.0/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -G Ninja
             -DCMAKE_BUILD_TYPE=Debug
             -DCMAKE_CXX_COMPILER=g++
             -DCMAKE_CUDA_HOST_COMPILER=g++
             -DCMAKE_CUDA_ARCHITECTURES=89
             -DMCPP_ENABLE_CUDA=ON
             -DMCPP_BUILD_SOLUTIONS=ON
             -DMCPP_BUILD_EXERCISES=OFF

      - name: Build the CUDA solutions
        run: cmake --build build --target solutions
